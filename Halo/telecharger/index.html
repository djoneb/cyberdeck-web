<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo · Téléchargement</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A1418; color: #F2F6F8;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 72px; height: 72px; }
  p { color: #A9B6BE; margin: 8px 0 0; }
  a { color: #9BEAD3; }
</style>
</head>
<body>
<main>
  <img src="../icon.svg" alt="">
  <h1 style="font-weight:600;margin:16px 0 0">Téléchargement de Halo…</h1>
  <p id="msg">Recherche de la dernière version.</p>
  <p><a id="fallback" href="https://github.com/djoneb/cyberdeck-releases/releases">Le téléchargement ne démarre pas ? Toutes les versions sur GitHub</a></p>
</main>
<script>
// Redirige vers l'APK de la dernière version de Halo publiée sur GitHub (dépôt public cyberdeck-releases, tags « halo-N »).
(async () => {
  const msg = document.getElementById('msg');
  try {
    const r = await fetch('https://api.github.com/repos/djoneb/cyberdeck-releases/releases?per_page=100', { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status);
    const rel = (await r.json()).filter(x => /^halo-\d+$/.test(x.tag_name) && !x.draft && !x.prerelease)
      .sort((a, b) => +b.tag_name.slice(5) - +a.tag_name.slice(5))[0];
    const apk = rel && rel.assets.find(a => /\.apk$/i.test(a.name));
    if (!apk) throw new Error('aucune version');
    msg.textContent = 'Halo ' + rel.tag_name.slice(5) + ' : le téléchargement va démarrer.';
    location.replace(apk.browser_download_url);
  } catch (e) {
    msg.textContent = 'Impossible de trouver la dernière version automatiquement.';
    location.replace(document.getElementById('fallback').href);
  }
})();
</script>
</body>
</html>
