<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de zone</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root { --bg: #04080c; --tx: #e8f4f8; --dim: #7f9aa2; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: Rajdhani, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1 { font-size: 28px; margin: 4px 0 4px; letter-spacing: .06em; }
.lead { color: var(--dim); margin: 0 0 12px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; font: 12px "Share Tech Mono"; color: var(--dim); }
.ctrl button { font: 600 13px Rajdhani; letter-spacing: .06em; color: #00d8f0; background: none; border: 1px solid rgba(255,255,255,.12); padding: 6px 10px; cursor: pointer; }
.ctrl button[aria-pressed="true"] { background: #00d8f0; color: #04080c; }
.zone { margin: 22px 0; }
.zh { display: flex; justify-content: space-between; align-items: baseline; font: 13px "Share Tech Mono"; letter-spacing: .14em; margin-bottom: 6px; }
.map { position: relative; width: 100%; aspect-ratio: 1.6; border: 1px solid var(--c); overflow: hidden;
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.lab { position: absolute; transform: translate(-50%, 0); text-align: center; pointer-events: none; white-space: nowrap; }
.lab b { display: block; font-size: 13px; background: rgba(3, 9, 14, .78); padding: 0 5px; }
.lab span { font: 10px "Share Tech Mono"; color: var(--c); background: rgba(3, 9, 14, .6); padding: 0 3px; }
.tag { position: absolute; left: 10px; top: 8px; display: flex; flex-direction: column; gap: 2px; font: 11px "Share Tech Mono"; background: rgba(3, 9, 14, .65); padding: 4px 8px; letter-spacing: .08em; }
@media (max-width: 600px) { .lab b { font-size: 11px; } }
/* Page d'appli : la carte occupe toute la vue */
html, body { height: 100%; overflow: hidden; }
.wrap, .zone { margin: 0 !important; padding: 0 !important; }
.zh, .ctrl, h1, .lead { display: none !important; }
.map { position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important; aspect-ratio: auto !important; clip-path: none !important; border: 0 !important; }
.lab { pointer-events: auto !important; cursor: pointer; }
</style></head><body><div class="wrap">
<div id="zones"></div></div>
<script>
const rnd = (s) => () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mix = (a, b, k) => { const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16), c = (s) => Math.round(((x >> s) & 255) * (1 - k) + ((y >> s) & 255) * k); return `rgb(${c(16)},${c(8)},${c(0)})`; };
const PHASES = ['LEVER DU SOLEIL', 'APRÈS-MIDI', 'SOIRÉE', 'NUIT'], WEATHERS = ['CIEL CLAIR', 'PLUIE ACIDE', 'ORAGE', 'TEMPÊTE DE SABLE', 'TEMPÊTE MAGNÉTIQUE'], WI = ['☀', '☂', 'ϟ', '≋', '⌁'];
const realPhase = () => { const h = new Date().getHours(); return h >= 6 && h < 12 ? 0 : h >= 12 && h < 18 ? 1 : h >= 18 && h < 22 ? 2 : 3; };
let forcePhase = null, forceWeather = null;
// Météo commune à toute NEO-BXL : exactement le même calcul que le jeu (périodes de 3 à 5 h)
class KRandom {
  // seed : nombre entier (Long Kotlin). Les graines utilisées restent bien en dessous de 2^53.
  constructor(seed, isInt = false) {
    const lo = seed | 0, hi = isInt ? (lo >> 31) : Math.floor(seed / 4294967296) | 0;
    this.x = lo; this.y = hi; this.z = 0; this.w = 0; this.v = ~lo; this.addend = (lo << 10) ^ (hi >>> 4);
    for (let i = 0; i < 64; i++) this.nextInt();
  }
  nextInt() {
    let t = this.x; t ^= t >>> 2;
    this.x = this.y; this.y = this.z; this.z = this.w;
    const v0 = this.v; this.w = v0;
    t = (t ^ (t << 1)) ^ v0 ^ (v0 << 4); this.v = t | 0;
    this.addend = (this.addend + 362437) | 0;
    return (t + this.addend) | 0;
  }
  nextBits(n) { return n === 0 ? 0 : this.nextInt() >>> (32 - n); }
  nextIntUntil(n) {
    if ((n & -n) === n) return this.nextBits(31 - Math.clz32(n));
    let bits, v;
    do { bits = this.nextInt() >>> 1; v = bits % n; } while (((bits - v + (n - 1)) | 0) < 0);
    return v;
  }
  nextFloat() { return this.nextBits(24) / 16777216; }
  nextBoolean() { return this.nextBits(1) !== 0; }
  shuffled(list) { const a = [...list]; for (let i = a.length - 1; i >= 1; i--) { const j = this.nextIntUntil(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
}
function segments(day) {
  const r = new KRandom(day * 31 + 7, true), pick = (n) => n < 35 ? 0 : n < 60 ? 1 : n < 75 ? 2 : n < 87 ? 3 : 4;
  const out = []; let h = 0, prev = -1;
  while (h < 24) { const len = 3 + r.nextIntUntil(3); let w = pick(r.nextIntUntil(100)); if (w === prev) w = pick(r.nextIntUntil(100)); if (w === prev) w = (w + 1) % 5; out.push([h, Math.min(24, h + len), w]); prev = w; h += len; }
  return out;
}
const cityWeather = () => { const d = new Date(), day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); return segments(day).find(x => d.getHours() < x[1]); };
const zoneWeather = () => forceWeather !== null ? forceWeather : cityWeather()[2];
const SKY = [['#f29e6b', '#6a4c93', '#0e1e33'], ['#3e86c4', '#123050', '#07131c'], ['#ff6b3d', '#7a2c5e', '#140a26'], ['#0a0418', '#03090e', '#020407']];
const ZONES = [
 { id: 'rouillebourg', name: 'ROUILLEBOURG', sub: 'ZONE INDUSTRIELLE', c: '#e07a3c', tint: '#3a1a08', style: 'factory',
   spots: [['rb_forge', 'La Fonderie', .28, .32, 'rave · 22h–06h'], ['rb_depot', 'Entrepôt 13', .68, .42, 'marché · 24/7'], ['rb_rails', 'Gare de triage', .5, .78, 'wagons · 24/7']] },
 { id: 'badlands', name: 'LES BADLANDS', sub: 'DÉSERT NOMADE', c: '#e0a050', tint: '#6b3a12', style: 'desert',
   spots: [['bl_camp', 'Campement nomade', .3, .55, 'feux · 24/7'], ['bl_scrap', 'Casse de Ferrailleville', .74, .5, '07h–20h'], ['bl_ring', 'Relais du Ring 14', .55, .82, 'station · 24/7']] },
 { id: 'necropole', name: 'NÉCROPOLE NORD', sub: 'OUVERTE LA NUIT', c: '#9fe8d0', tint: '#0a2a26', style: 'necro',
   spots: [['np_gate', 'Portes de la Nécropole', .55, .88, '22h–06h'], ['np_crypt', 'Crypte des mémoires', .235, .45, '22h–06h'], ['np_chapel', 'Chapelle des serveurs', .715, .39, '22h–06h']] },
 { id: 'tour', name: 'TOUR KUROGANE', sub: 'ZONE FINALE', c: '#ff2e3e', tint: '#2a0408', style: 'tower',
   spots: [['tk_hall', 'Hall de la Tour', .5, .86, '07h–22h'], ['tk_42', 'Étage 42', .5, .53, '08h–20h'], ['tk_90', 'Étage 90', .5, .17, '?']] },
 { id: 'aurore', name: 'NOVA PRIME', sub: 'LA VILLE SUSPENDUE', c: '#ffd27a', tint: '#3a2a0a', style: 'sky',
   spots: [['au_lounge', 'Sky Lounge Zénith', .24, .36, '16h–04h'], ['au_spa', 'Thermes Orbitaux', .74, .3, '24/7'], ['au_gallery', 'Galerie Prisme', .66, .68, '10h–22h'], ['au_regatta', 'Régates de drones', .3, .74, '12h–23h']] },
];
// Contrôles de test
const ph = document.getElementById('ph'), we = document.getElementById('we');
const btns = (box, items, get, set) => { box.innerHTML = items.map((t, i) => `<button data-i="${i}">${t}</button>`).join('');
  const sync = () => box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i - 1 === get())));
  box.querySelectorAll('button').forEach(b => b.onclick = () => { set(+b.dataset.i - 1); sync(); }); sync(); };
if (ph) btns(ph, ['TEMPS RÉEL', ...PHASES], () => forcePhase === null ? -1 : forcePhase, (v) => forcePhase = v < 0 ? null : v);
if (we) btns(we, ['TEMPS RÉEL', ...WEATHERS], () => forceWeather === null ? -1 : forceWeather, (v) => forceWeather = v < 0 ? null : v);

const box = document.getElementById('zones');
const ONLY = new URLSearchParams(location.search).get('zone');
ZONES.forEach((z, zi) => { if (ONLY && z.id !== ONLY) return;
  const el = document.createElement('div'); el.className = 'zone'; el.style.setProperty('--c', z.c);
  el.innerHTML = `<div class="zh"><span style="color:${z.c}">◆ ${z.name}</span><span style="color:var(--dim)">${z.sub}</span></div>
    <div class="map"><canvas></canvas><div class="labs"></div><div class="tag"></div></div>`;
  box.appendChild(el);
  const cv = el.querySelector('canvas'), g = cv.getContext('2d'), labs = el.querySelector('.labs'), tag = el.querySelector('.tag');
  let W = 0, H = 0, dpr = 1;
  const flat = ['tower', 'sky', 'desert'].includes(z.style);
  const isoN = (u, v) => [.5 + (u - v) * .43, .2 + (u + v) * .38];
  const fit = () => { const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = cv.width = r.width * dpr; H = cv.height = r.height * dpr;
    labs.innerHTML = z.spots.map(([pid, n, x, y, h]) => { const p = flat ? [x, y] : isoN(x, y);
      return `<div class="lab" data-p="${pid}" style="left:${p[0] * 100}%;top:${(p[1] + .035) * 100}%"><b>${n}</b><span>${h}</span></div>`; }).join('');
    labs.querySelectorAll('[data-p]').forEach(l => l.onclick = () => window.CD ? CD.visit(l.dataset.p) : parent.postMessage({ cdVisit: l.dataset.p }, '*')); };
  const P = (u, v, h = 0) => { const [x, y] = isoN(u, v); return [x * W, y * H - h * H]; };
  const poly = (pts, f) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = f; g.fill(); };
  const line = (a, b, c, w) => { g.strokeStyle = c; g.lineWidth = w * dpr; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  // Bloc isométrique avec fenêtres éclairées
  const block = (u, v, s, h, cols, glow, lit, t, seed) => {
    const a = P(u - s, v + s), b = P(u + s, v + s), c = P(u + s, v - s), d = P(u - s, v - s), up = (p) => [p[0], p[1] - h * H];
    poly([a, b, up(b), up(a)], cols[1]); poly([b, c, up(c), up(b)], cols[2]); poly([up(a), up(b), up(c), up(d)], cols[0]);
    if (glow) { g.strokeStyle = glow; g.lineWidth = 1.5 * dpr; g.beginPath(); [up(a), up(b), up(c), up(d), up(a)].forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke(); }
    const rows = Math.max(1, Math.floor(h * H / (9 * dpr))), r = rnd(seed);
    for (let row = 0; row < rows; row++) for (let k = 0; k < 3; k++) { if (r() > lit) continue; const f = (k + .5) / 3, zz = h * (row + .6) / (rows + .4);
      const o = P(u - s + 2 * s * f, v + s, zz); const on = Math.sin(t * .7 + r() * 50) > -.6; if (on) line(o, [o[0] + 3 * dpr, o[1] + 1.5 * dpr], rgba(r() > .5 ? '#ffe6a8' : glow || '#ffe6a8', .6), 2); }
    return up(P(u, v));
  };

  // ── Éléments détaillés réutilisables
  const rr = (x, y, w, h, r, f) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fillStyle = f; g.fill(); };
  const glow = (x, y, r, c, a) => { const q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, rgba(c, a)); q.addColorStop(1, rgba(c, 0)); g.fillStyle = q; g.fillRect(x - r, y - r, r * 2, r * 2); };
  // Camion de convoi (cabine + remorque), vu de profil, sens dir = 1 vers la droite
  const truck = (x, y, s, dir, cab, cargo, night) => { g.save(); g.translate(x, y); g.scale(dir * s * dpr, s * dpr);
    rr(-46, -20, 34, 18, 2, cargo); g.fillStyle = 'rgba(0,0,0,.25)'; for (let k = 0; k < 5; k++) g.fillRect(-44 + k * 7, -18, 1.2, 14);
    g.fillStyle = '#e0a050'; g.fillRect(-46, -8, 34, 1.5);
    rr(-11, -18, 15, 16, 3, cab); g.fillStyle = night ? '#ffd27a' : '#8fd3ff'; g.beginPath(); g.moveTo(-1, -16); g.lineTo(3, -16); g.lineTo(4, -9); g.lineTo(-1, -9); g.fill();
    g.fillStyle = '#1a120b'; g.fillRect(-9, -22, 2, 6); g.fillStyle = '#222'; g.fillRect(-14, -3, 18, 2);
    [-40, -30, -20, -4].forEach(wx => { g.fillStyle = '#111'; g.beginPath(); g.arc(wx, -1, 3.6, 0, 7); g.fill(); g.fillStyle = '#777'; g.beginPath(); g.arc(wx, -1, 1.4, 0, 7); g.fill(); });
    g.fillStyle = '#ffe9b0'; g.fillRect(3.5, -7, 1.5, 2.5); g.fillStyle = '#ff3b3b'; g.fillRect(-46.5, -6, 1.2, 2);
    g.restore();
    if (night) { g.save(); g.translate(x, y); const hx = dir * 6 * s * dpr; const q = g.createLinearGradient(hx, 0, hx + dir * 70 * s * dpr, 0); q.addColorStop(0, 'rgba(255,233,176,.45)'); q.addColorStop(1, 'rgba(255,233,176,0)');
      g.fillStyle = q; g.beginPath(); g.moveTo(hx, -6 * s * dpr); g.lineTo(hx + dir * 70 * s * dpr, -18 * s * dpr); g.lineTo(hx + dir * 70 * s * dpr, 8 * s * dpr); g.closePath(); g.fill(); g.restore(); } };
  // Voiture volante : coque profilée, verrière, lueur dessous, traînée
  const hoverCar = (x, y, s, dir, col, night) => { g.save(); g.translate(x, y); g.scale(dir * s * dpr, s * dpr);
    g.fillStyle = rgba(col, .18); g.fillRect(-40, -1, 30, 2);
    g.fillStyle = '#1b1f2a'; g.beginPath(); g.moveTo(-14, 0); g.quadraticCurveTo(-12, -7, 0, -7); g.quadraticCurveTo(12, -6, 15, 0); g.quadraticCurveTo(0, 3, -14, 0); g.fill();
    g.fillStyle = rgba('#9ff3ff', .75); g.beginPath(); g.moveTo(-5, -6.5); g.quadraticCurveTo(2, -10, 8, -5.5); g.lineTo(-5, -5.5); g.fill();
    g.fillStyle = col; g.fillRect(-13, -1.5, 27, 1.2); g.fillStyle = '#fff6c8'; g.fillRect(13, -2.5, 2, 1.5); g.fillStyle = '#ff3b4e'; g.fillRect(-15, -2.5, 1.5, 1.5);
    g.restore(); glow(x, y + 3 * s * dpr, 12 * s * dpr, col, night ? .45 : .2); };
  // Tente de nomade réaliste : tente-cabane rectangulaire, toit à deux pans, auvent, haubans
  const tent = (x, y, w, c, night) => { const h = w * .55, d = w * .35;
    g.fillStyle = mix(c, '#000000', .35); g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w + d, y - d * .5); g.lineTo(x + w + d, y - h - d * .5); g.lineTo(x + w, y - h); g.fill();
    g.fillStyle = c; g.fillRect(x, y - h, w, h);
    g.fillStyle = mix(c, '#ffffff', .12); g.beginPath(); g.moveTo(x - 2 * dpr, y - h); g.lineTo(x + w * .5, y - h - w * .28); g.lineTo(x + w + 2 * dpr, y - h); g.fill();
    g.fillStyle = mix(c, '#000000', .2); g.beginPath(); g.moveTo(x + w * .5, y - h - w * .28); g.lineTo(x + w * .5 + d, y - h - w * .28 - d * .5); g.lineTo(x + w + d + 2 * dpr, y - h - d * .5); g.lineTo(x + w + 2 * dpr, y - h); g.fill();
    g.fillStyle = 'rgba(0,0,0,.18)'; for (let k = 1; k < 4; k++) g.fillRect(x + w * k / 4, y - h, 1 * dpr, h);
    const dw = w * .28; g.fillStyle = night ? 'rgba(255,190,100,.85)' : 'rgba(40,25,15,.75)'; g.fillRect(x + w * .36, y - h * .78, dw, h * .78);
    g.fillStyle = mix(c, '#000000', .1); g.beginPath(); g.moveTo(x + w * .3, y - h * .82); g.lineTo(x + w * .72, y - h * .82); g.lineTo(x + w * .8, y - h * .62); g.lineTo(x + w * .22, y - h * .62); g.fill();
    g.strokeStyle = 'rgba(30,20,10,.6)'; g.lineWidth = .8 * dpr; g.beginPath(); g.moveTo(x, y - h); g.lineTo(x - w * .25, y); g.moveTo(x + w, y - h); g.lineTo(x + w * 1.2, y); g.stroke();
    if (night) glow(x + w * .5, y - h * .4, w * .9, '#ffb04a', .25); };
  // Yacht volant de luxe : coque effilée, ponts vitrés, liserés néon, réacteurs
  const yacht = (x, y, s, dir, t) => { g.save(); g.translate(x, y); g.scale(dir * s * dpr, s * dpr);
    const hg = g.createLinearGradient(0, -14, 0, 8); hg.addColorStop(0, '#2c2147'); hg.addColorStop(1, '#0d0b1c'); g.fillStyle = hg;
    g.beginPath(); g.moveTo(-60, -4); g.quadraticCurveTo(-40, 8, 20, 6); g.quadraticCurveTo(55, 2, 62, -6); g.quadraticCurveTo(10, -10, -60, -4); g.fill();
    g.fillStyle = '#3a2d63'; g.beginPath(); g.moveTo(-35, -6); g.quadraticCurveTo(-10, -18, 25, -9); g.lineTo(-35, -6); g.fill();
    g.fillStyle = rgba('#7af3ff', .8); for (let k = 0; k < 8; k++) g.fillRect(-28 + k * 6, -11 + Math.abs(k - 4) * .6, 4, 2);
    g.fillStyle = '#ff4fd8'; g.fillRect(-58, -1, 110, 1.2); g.fillStyle = '#ffd27a'; g.fillRect(-40, 3, 70, .8);
    g.restore(); glow(x - dir * 62 * s * dpr, y - 2 * s * dpr, 18 * s * dpr, '#6ff3ff', .55 + .25 * Math.sin(t * 9)); };
  // Tour futuriste effilée (pas de cube) : flèche courbe, verre sombre, bandes lumineuses, anneau, balise
  const spire = (x, y, h, w, c1, c2, t, seed) => {
    const top = y - h, gr2 = g.createLinearGradient(x - w, 0, x + w, 0); gr2.addColorStop(0, '#120c2a'); gr2.addColorStop(.5, '#2a1f55'); gr2.addColorStop(1, '#0b0820');
    g.fillStyle = gr2; g.beginPath(); g.moveTo(x - w, y); g.bezierCurveTo(x - w * 1.1, y - h * .45, x - w * .35, y - h * .8, x, top); g.bezierCurveTo(x + w * .35, y - h * .8, x + w * 1.1, y - h * .45, x + w, y); g.closePath(); g.fill();
    const r = rnd(seed); for (let k = 0; k < 3; k++) { const fx = (k - 1) * w * .45; g.strokeStyle = rgba(k === 1 ? c1 : c2, .75); g.lineWidth = 1.3 * dpr; g.beginPath(); g.moveTo(x + fx, y - 2 * dpr); g.quadraticCurveTo(x + fx * .6, y - h * .55, x, top + 6 * dpr); g.stroke(); }
    for (let k = 0; k < 10; k++) { const yy = y - h * (.08 + k * .075), ww = w * (1 - k * .085); if (r() < .65) { g.fillStyle = rgba(r() < .5 ? c1 : '#ffe9b0', .35 + .3 * Math.sin(t * 2 + k + seed)); g.fillRect(x - ww * .7, yy, ww * 1.4, 1.2 * dpr); } }
    const ry = y - h * .55; g.strokeStyle = rgba(c1, .55 + .3 * Math.sin(t * 1.5 + seed)); g.lineWidth = 2 * dpr; g.beginPath(); g.ellipse(x, ry, w * 1.5, w * .35, 0, 0, 7); g.stroke();
    glow(x, ry, w * 2, c1, .18); glow(x, top, 10 * dpr, c2, .8); g.fillStyle = (Math.floor(t * 2 + seed) % 2) ? c2 : '#ffffff'; g.beginPath(); g.arc(x, top, 2 * dpr, 0, 7); g.fill(); };
  // Panneau holographique flottant
  const holo = (x, y, w, h, c, t) => { g.save(); g.globalAlpha = .75 + .2 * Math.sin(t * 3 + x); const q = g.createLinearGradient(x, y, x + w, y + h); q.addColorStop(0, rgba(c, .55)); q.addColorStop(1, rgba('#6ff3ff', .25));
    rr(x, y, w, h, 3 * dpr, q); g.fillStyle = 'rgba(255,255,255,.75)'; for (let k = 0; k < 3; k++) g.fillRect(x + 4 * dpr, y + 4 * dpr + k * h * .26, (w - 8 * dpr) * (.4 + .5 * ((Math.sin(t + k * 2) + 1) / 2)), 1.6 * dpr); g.restore(); };
  const frame = (ms) => {
    const t = ms / 1000, phase = forcePhase ?? realPhase(), night = phase === 3, weather = zoneWeather(zi), R = rnd(1000 + zi * 31);
